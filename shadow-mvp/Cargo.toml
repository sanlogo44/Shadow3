[workspace]
resolver = "2"
members = ["crates/shadow-core", "crates/shadow-cli"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
sha2 = "0.10"
